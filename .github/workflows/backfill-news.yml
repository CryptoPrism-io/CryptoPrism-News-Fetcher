name: Backfill Crypto News

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        default: "2026-07-20"
      end_date:
        description: "End date (YYYY-MM-DD, inclusive)"
        required: true
        default: "2026-07-31"
      window_hours:
        description: "Hours per fetch window (smaller = more API calls but safer)"
        required: false
        default: "24"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install base dependencies
        run: pip install -r requirements.txt

      - name: Install ML dependencies (sentiment backfill)
        run: pip install transformers torch sentencepiece tqdm

      - name: Create .env file
        run: |
          cat > .env << EOF
          CRYPTOCOMPARE_API_KEY=${{ secrets.CRYPTOCOMPARE_API_KEY }}
          DB_HOST=${{ secrets.DB_HOST }}
          DB_PORT=${{ secrets.DB_PORT }}
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          EOF

      - name: Test DB connection
        run: python -c "from etl.load.db_cc_news import test_connection; ok = test_connection(); exit(0 if ok else 1)"

      - name: Apply migration 019 — widen news_id to BIGINT (idempotent)
        run: |
          python -c "
          from dotenv import load_dotenv; load_dotenv()
          import os, psycopg2
          conn = psycopg2.connect(
              host=os.environ['DB_HOST'], port=os.environ.get('DB_PORT',5432),
              dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'],
              password=os.environ['DB_PASSWORD'], sslmode=os.environ.get('DB_SSLMODE','require')
          )
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute(\"SELECT data_type FROM information_schema.columns WHERE table_name = 'FE_NEWS_SENTIMENT' AND column_name = 'news_id'\")
          row = cur.fetchone()
          if row and row[0] == 'bigint':
              print('news_id already BIGINT. No-op.')
          else:
              print('Applying migration 019 (news_id INTEGER -> BIGINT)...')
              with open('migrations/019_fe_news_sentiment_news_id_bigint.sql') as f:
                  cur.execute(f.read())
              print('Applied.')
          conn.close()
          "

      - name: Backfill cc_news via CryptoCompare API
        run: |
          python -m etl.extract.backfill \
            --start "${{ github.event.inputs.start_date }}" \
            --end "${{ github.event.inputs.end_date }}" \
            --window-hours "${{ github.event.inputs.window_hours }}"

      - name: Score sentiment backlog (FinBERT → FE_NEWS_SENTIMENT)
        run: |
          python -m etl.transform.sentiment --batch-size 64 --from-date "${{ github.event.inputs.start_date }}"

      - name: Regenerate news signals (FE_NEWS_SENTIMENT → FE_NEWS_SIGNALS)
        run: |
          python -m ml.features.news_signals --from-date "${{ github.event.inputs.start_date }}"

      - name: Report row counts
        if: always()
        run: |
          python -c "
          from dotenv import load_dotenv; load_dotenv()
          import os, psycopg2
          conn = psycopg2.connect(
              host=os.environ['DB_HOST'], port=os.environ.get('DB_PORT',5432),
              dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'],
              password=os.environ['DB_PASSWORD'], sslmode=os.environ.get('DB_SSLMODE','require')
          )
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM cc_news')
          print(f'cc_news rows: {cur.fetchone()[0]}')
          cur.execute('SELECT COUNT(*) FROM \"FE_NEWS_SENTIMENT\"')
          print(f'FE_NEWS_SENTIMENT rows: {cur.fetchone()[0]}')
          cur.execute('SELECT COUNT(*) FROM \"FE_NEWS_SIGNALS\"')
          print(f'FE_NEWS_SIGNALS rows: {cur.fetchone()[0]}')
          cur.execute('SELECT MAX(timestamp) FROM \"FE_NEWS_SIGNALS\"')
          print(f'FE_NEWS_SIGNALS latest: {cur.fetchone()[0]}')
          conn.close()
          "

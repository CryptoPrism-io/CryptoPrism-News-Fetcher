name: Daily NLP Pipeline

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC daily — after FE_* tables update at 00:00
  workflow_dispatch:
    inputs:
      from_date:
        description: 'Reprocess from date (YYYY-MM-DD). Leave empty for incremental.'
        required: false
        default: ''

jobs:
  nlp-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120    # FinBERT on 1000 articles takes ~10min on CPU

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install base dependencies
        run: pip install -r requirements.txt

      - name: Install ML dependencies
        run: pip install transformers torch sentencepiece tqdm

      - name: Create .env file
        run: |
          echo "DB_HOST=${{ secrets.DB_HOST }}" > .env
          echo "DB_PORT=${{ secrets.DB_PORT }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          SSLMODE="${{ secrets.DB_SSLMODE }}"
          [ -n "$SSLMODE" ] && echo "DB_SSLMODE=$SSLMODE" >> .env || true

      - name: Test DB connection
        run: |
          python -c "
          from dotenv import load_dotenv; load_dotenv()
          import os, psycopg2
          kwargs = dict(
              host=os.environ['DB_HOST'], port=os.environ.get('DB_PORT', 5432),
              dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'],
              password=os.environ['DB_PASSWORD'],
          )
          sslmode = os.environ.get('DB_SSLMODE', '').strip()
          if sslmode:
              kwargs['sslmode'] = sslmode
          conn = psycopg2.connect(**kwargs)
          print('DB connection OK')
          conn.close()
          "

      - name: Apply migration 019 — widen news_id to BIGINT (idempotent)
        run: |
          python -c "
          from dotenv import load_dotenv; load_dotenv()
          import os, psycopg2
          conn = psycopg2.connect(
              host=os.environ['DB_HOST'], port=os.environ.get('DB_PORT',5432),
              dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'],
              password=os.environ['DB_PASSWORD'], sslmode=os.environ.get('DB_SSLMODE','require')
          )
          conn.autocommit = True
          cur = conn.cursor()
          cur.execute(\"SELECT data_type FROM information_schema.columns WHERE table_name = 'FE_NEWS_SENTIMENT' AND column_name = 'news_id'\")
          row = cur.fetchone()
          if row and row[0] == 'bigint':
              print('news_id already BIGINT. No-op.')
          else:
              print('Applying migration 019 (news_id INTEGER -> BIGINT)...')
              with open('migrations/019_fe_news_sentiment_news_id_bigint.sql') as f:
                  cur.execute(f.read())
              print('Applied.')
          conn.close()
          "

      - name: Step 1 — Score articles with FinBERT → FE_NEWS_SENTIMENT
        run: |
          FROM_DATE="${{ github.event.inputs.from_date }}"
          if [ -n "$FROM_DATE" ]; then
            python -m etl.transform.sentiment --batch-size 64 --from-date "$FROM_DATE"
          else
            python -m etl.transform.sentiment --batch-size 64
          fi

      - name: Step 2 — Aggregate signals → FE_NEWS_SIGNALS
        run: |
          FROM_DATE="${{ github.event.inputs.from_date }}"
          if [ -n "$FROM_DATE" ]; then
            python -m ml.features.news_signals --from-date "$FROM_DATE"
          else
            python -m ml.features.news_signals
          fi

      - name: Report row counts
        if: always()
        run: |
          python -c "
          from dotenv import load_dotenv; load_dotenv()
          import os, psycopg2
          kwargs = dict(host=os.environ['DB_HOST'], port=os.environ.get('DB_PORT',5432),
              dbname=os.environ['DB_NAME'], user=os.environ['DB_USER'], password=os.environ['DB_PASSWORD'])
          sslmode = os.environ.get('DB_SSLMODE','').strip()
          if sslmode: kwargs['sslmode'] = sslmode
          conn = psycopg2.connect(**kwargs)
          cur = conn.cursor()
          cur.execute('SELECT COUNT(*) FROM \"FE_NEWS_SENTIMENT\"')
          print(f'FE_NEWS_SENTIMENT rows: {cur.fetchone()[0]}')
          cur.execute('SELECT COUNT(*) FROM \"FE_NEWS_SIGNALS\"')
          print(f'FE_NEWS_SIGNALS rows: {cur.fetchone()[0]}')
          cur.execute('SELECT MAX(timestamp) FROM \"FE_NEWS_SIGNALS\"')
          print(f'FE_NEWS_SIGNALS latest: {cur.fetchone()[0]}')
          conn.close()
          "
